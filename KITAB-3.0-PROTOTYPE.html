<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Kitab 3.0 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#FAF7F2; --surface:#FFFFFF; --surface-2:#F3EDE3; --line:#E8DDD0; --line-2:#D4C4B0;
  --ink:#1C1917; --ink-2:#44403C; --ink-3:#78716C; --ink-4:#A8A29E;
  --teal:#0F766E; --teal-2:#115E59; --teal-wash:#E6F7F4; --teal-line:#99E6DA;
  --amber:#D97706; --amber-wash:#FFF7E6; --emerald:#059669; --rose:#E11D48; --blue:#2563EB;
  --star:#F59E0B;
  --studio:#EFE9DF; --frame:#1C1917;
  --shadow-cover:2px 4px 12px rgba(28,25,23,.20), 0 1px 3px rgba(28,25,23,.10);
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#1C1917; --surface:#292524; --surface-2:#221E1B; --line:#3F3A36; --line-2:#57534E;
  --ink:#FAF7F2; --ink-2:#E8DDD0; --ink-3:#A8A29E; --ink-4:#78716C;
  --teal:#2DD4BF; --teal-2:#99F6E4; --teal-wash:rgba(45,212,191,.10); --teal-line:rgba(45,212,191,.32);
  --amber:#FBBF24; --amber-wash:rgba(251,191,36,.10); --emerald:#34D399; --rose:#FB7185; --blue:#60A5FA;
  --star:#FBBF24;
  --studio:#141210; --frame:#0E0C0B;
  --shadow-cover:2px 4px 14px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#1C1917; --surface:#292524; --surface-2:#221E1B; --line:#3F3A36; --line-2:#57534E;
  --ink:#FAF7F2; --ink-2:#E8DDD0; --ink-3:#A8A29E; --ink-4:#78716C;
  --teal:#2DD4BF; --teal-2:#99F6E4; --teal-wash:rgba(45,212,191,.10); --teal-line:rgba(45,212,191,.32);
  --amber:#FBBF24; --amber-wash:rgba(251,191,36,.10); --emerald:#34D399; --rose:#FB7185; --blue:#60A5FA;
  --star:#FBBF24;
  --studio:#141210; --frame:#0E0C0B;
  --shadow-cover:2px 4px 14px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--studio);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
input,textarea,select{font:inherit;font-size:16px}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.fill{fill:currentColor;stroke:none}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;line-height:1.15;text-wrap:balance}
p{margin:0}

/* ── Studio (desktop) ── */
.studio{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{display:none}
.stage{display:grid;place-items:start center;padding:0}
@media (min-width:900px){
  .studio{grid-template-columns:300px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:18px;padding:28px 24px;border-right:1px solid var(--line);background:var(--paper);position:sticky;top:0;height:100vh;overflow:auto}
  .stage{padding:36px 24px 60px}
}
.rail h1{font-size:26px}
.rail .sub{color:var(--ink-3);font-size:14px;line-height:1.45}
.rail .lbl{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);margin-top:6px}
.rail .list{display:grid;gap:4px}
.rail .list button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:8px;font-size:14.5px;color:var(--ink-2)}
.rail .list button:hover{background:var(--surface-2)}
.rail .list button.on{background:var(--teal-wash);color:var(--teal-2);font-weight:500}
.rail .list button .k{font-family:var(--mono);font-size:11px;color:var(--ink-4);margin-left:auto}
.rail .toggles{display:flex;gap:8px;flex-wrap:wrap}
.rail .toggles button{padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;font-size:13.5px;color:var(--ink-2);background:var(--surface)}
.rail .toggles button.on{border-color:var(--teal);color:var(--teal-2);background:var(--teal-wash)}
.rail .notes{font-size:13.5px;color:var(--ink-3);line-height:1.5;display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rail .notes b{color:var(--ink-2);font-weight:500}
.rail .notes ul{margin:0;padding-left:1.1em;display:grid;gap:5px}

/* ── Phone frame ── */
.phone{position:relative;width:100%;height:100%;background:var(--paper);color:var(--ink);overflow:hidden;font-size:16px}
@media (min-width:900px){
  .phone{width:390px;height:844px;border-radius:46px;border:10px solid var(--frame);box-shadow:0 30px 80px rgba(0,0,0,.35);}
  .phone::after{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:var(--frame);z-index:60;pointer-events:none}
  .phone .statusbar{display:flex}
}
.statusbar{display:none;position:absolute;top:0;left:0;right:0;height:52px;align-items:center;justify-content:space-between;padding:14px 30px 0;font-family:var(--sans);font-weight:600;font-size:15px;z-index:59;pointer-events:none}
.statusbar .cell{display:flex;gap:5px;align-items:center;font-size:13px}
.screens{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:none;padding:0 0 calc(92px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}
.screen.full{padding-bottom:0}
@media (min-width:900px){ .screen{padding-top:44px} .screen.full{padding-top:0} }
.pad{padding-inline:20px}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 20px 12px}
.hdr h1{font-size:30px;letter-spacing:-.01em}
.hdr .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.hdr .tools{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);font-size:20px;border:1px solid transparent}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.primary{background:var(--teal);color:#fff}
.icon-btn.outline{border-color:var(--line-2)}
.icon-btn.on{background:var(--teal-wash);color:var(--teal-2);border-color:var(--teal-line)}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){ .tabbar{padding-bottom:22px;border-radius:0 0 36px 36px} }
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 2px;color:var(--ink-4);font-size:14px;font-weight:500;border-radius:12px}
.tabbar button .i{font-size:23px}
.tabbar button.on{color:var(--teal)}

/* Segmented control */
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 20px 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);font-size:14.5px;font-weight:500;background:var(--surface)}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button .c{font-family:var(--mono);font-size:12px;color:var(--ink-4);margin-left:6px}
.seg button.on .c{color:color-mix(in srgb,var(--paper) 70%,transparent)}

/* Covers */
.cover{position:relative;aspect-ratio:2/3;border-radius:6px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:7% 8%;overflow:hidden;box-shadow:var(--shadow-cover);background:linear-gradient(160deg,hsl(var(--h) 40% 36%) 0%,hsl(var(--h) 46% 20%) 100%);flex-shrink:0;cursor:pointer;user-select:none;-webkit-user-select:none}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 60%)}
.cover .ct{font-family:var(--serif);font-weight:600;line-height:1.08;position:relative;z-index:1;text-wrap:balance}
.cover .ca{font-family:var(--sans);opacity:.78;position:relative;z-index:1;margin-top:.35em;letter-spacing:.02em}
.cover.classic{background:linear-gradient(170deg,#F6F0E6 0%,#E8DDD0 100%);color:#1C1917;border:1px solid rgba(28,25,23,.14)}
.cover.classic .ct{font-weight:400;font-style:italic}
.cover.classic::before{background:linear-gradient(90deg,hsl(var(--h) 40% 40% / .9),hsl(var(--h) 40% 40% / .9));width:5%}
.cover.classic::after{background:none}
.cover-sm{width:44px;border-radius:4px} .cover-sm .ct{font-size:7px} .cover-sm .ca{display:none}
.cover-md{width:72px} .cover-md .ct{font-size:10.5px} .cover-md .ca{font-size:8px}
.cover-lg{width:112px;border-radius:8px} .cover-lg .ct{font-size:15px} .cover-lg .ca{font-size:11px}
.cover-xl{width:136px;border-radius:9px} .cover-xl .ct{font-size:18px} .cover-xl .ca{font-size:12px}
.cover-grid{width:100%} .cover-grid .ct{font-size:13px} .cover-grid .ca{font-size:10px}

/* Cards and rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.sec{display:grid;gap:12px;padding:6px 20px 10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between}
.sec-h h2{font-size:20px}
.sec-h a,.sec-h button.link{color:var(--teal);font-size:14.5px;font-weight:500}
.row{display:flex;gap:14px;align-items:center;padding:12px 20px}
.row + .row{border-top:1px solid var(--line)}
.row .t{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.2;color:var(--ink)}
.row .a{font-size:14px;color:var(--ink-3);margin-top:2px}
.row .n{font-size:14px;color:var(--ink-3);font-style:italic;margin-top:4px}
.row .body{flex:1;min-width:0}
.grip{color:var(--ink-4);font-size:18px;touch-action:none;cursor:grab}
.pbar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.pbar > i{display:block;height:100%;background:var(--teal);border-radius:999px}
.meta{font-size:14px;color:var(--ink-3)}
.meta b{color:var(--ink-2);font-weight:500}
.stars{display:inline-flex;gap:2px;color:var(--star);font-size:15px;vertical-align:middle}
.stars .i{width:1em;height:1em}
.stars .off{color:var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-4)}
.pill.reading .dot{background:var(--teal)} .pill.tbr .dot{background:var(--amber)} .pill.read .dot{background:var(--emerald)} .pill.dnf .dot{background:var(--rose)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:500;font-size:15.5px;border:1px solid transparent}
.btn.primary{background:var(--teal);color:#fff}
.btn.secondary{border-color:var(--line-2);color:var(--ink-2);background:var(--surface)}
.btn.ghost{color:var(--teal);padding-inline:8px}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line-2);font-size:14px;color:var(--ink-2);background:var(--surface)}
.chip.on{border-color:var(--teal);color:var(--teal-2);background:var(--teal-wash)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.quote{font-family:var(--serif);font-style:italic;font-size:18px;line-height:1.5;color:var(--ink)}
.hl{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);display:grid;gap:8px;position:relative}
.hl .q{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.5;color:var(--ink)}
.hl .m{font-size:13.5px;color:var(--ink-3);display:flex;gap:10px;align-items:center}
.hl .fav{position:absolute;top:10px;right:10px;color:var(--star);font-size:16px}
.hl .note{font-size:14.5px;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--line)}
.hl .note b{font-weight:500;color:var(--ink-3);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 12px;padding:6px 20px 12px}
.grid3 .cell{display:grid;gap:6px}
.grid3 .cell .t{font-family:var(--serif);font-size:13.5px;font-weight:600;line-height:1.15;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid3 .cell .stars{font-size:12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.stat3 .s{padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.stat3 .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat3 .l{font-size:13px;color:var(--ink-3);margin-top:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 20px}
.cal .d{aspect-ratio:1;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;color:var(--ink-4);font-variant-numeric:tabular-nums;position:relative}
.cal .d.log{background:var(--teal-wash);color:var(--teal-2)}
.cal .d.log::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.cal .d.fin{background:var(--teal);color:#fff}
.cal .d.today{outline:2px solid var(--ink);outline-offset:-2px}
.cal .wd{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);text-align:center}
.setting{display:flex;align-items:center;gap:12px;padding:13px 16px}
.setting + .setting{border-top:1px solid var(--line)}
.setting .i{font-size:19px;color:var(--teal)}
.setting .body{flex:1;min-width:0}
.setting .l{font-size:15.5px;color:var(--ink);font-weight:500}
.setting .d{font-size:13.5px;color:var(--ink-3)}
.setting .chev{color:var(--ink-4);font-size:18px}
.switch{width:44px;height:26px;border-radius:13px;background:var(--line-2);position:relative;flex-shrink:0}
.switch.on{background:var(--teal)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .18s}
.switch.on::after{left:20px}
.toast{position:absolute;left:50%;transform:translateX(-50%) translateY(10px);top:64px;z-index:80;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px;font-size:14.5px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:88%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{color:var(--teal);font-weight:600}
@media (min-width:900px){ .toast{top:60px} }

/* Sheets */
.sheet-root{position:absolute;inset:0;z-index:70;pointer-events:none}
.backdrop{position:absolute;inset:0;background:rgba(28,25,23,.45);opacity:0;transition:opacity .2s;pointer-events:none}
.sheet-root.on .backdrop{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1);pointer-events:auto;padding:0 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){ .sheet{padding-bottom:34px;border-radius:22px 22px 34px 34px} }
.sheet-root.on .sheet{transform:translateY(0)}
.sheet .handle{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:10px auto 14px}
.sheet h2{font-size:21px;margin-bottom:12px}
.sheet .stack{display:grid;gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:13.5px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);color:var(--ink);font-size:16px}
.field textarea{resize:none}
.search{display:flex;align-items:center;gap:10px;padding:0 12px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2)}
.search .i{color:var(--ink-4);font-size:18px}
.search input{flex:1;border:0;background:transparent;padding:12px 0;color:var(--ink);font-size:16px;outline:none}
.result{display:flex;gap:12px;align-items:center;padding:10px 0}
.result + .result{border-top:1px solid var(--line)}
.result .body{flex:1;min-width:0}
.result .t{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.2}
.result .a{font-size:13.5px;color:var(--ink-3)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numpad button{height:54px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:500;border:1px solid var(--line)}
.bignum{font-family:var(--serif);font-size:54px;font-weight:600;text-align:center;line-height:1;font-variant-numeric:tabular-nums;padding:6px 0 2px}
.bignum small{display:block;font-family:var(--sans);font-size:14px;color:var(--ink-3);font-weight:400;margin-top:8px}
.action{display:flex;align-items:center;gap:14px;padding:13px 4px;font-size:16px;color:var(--ink);width:100%;text-align:left}
.action + .action{border-top:1px solid var(--line)}
.action .i{font-size:20px;color:var(--teal)}
.action.danger,.action.danger .i{color:var(--rose)}
.action .chev{margin-left:auto;color:var(--ink-4)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 4px;width:100%;text-align:left;font-size:16px}
.opt + .opt{border-top:1px solid var(--line)}
.opt .dot{width:10px;height:10px;border-radius:50%}
.opt .chk{margin-left:auto;color:var(--teal);font-size:18px}
.coverpick{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.coverpick .c{display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--ink-3)}
.coverpick .c.on .cover{outline:2px solid var(--teal);outline-offset:2px}
.photo{width:72px;aspect-ratio:2/3;border:1px dashed var(--line-2);border-radius:6px;display:grid;place-items:center;color:var(--ink-4);font-size:20px}

/* Book page */
.hero{position:relative;padding:18px 20px 12px;display:flex;gap:16px;align-items:flex-end}
.hero .amb{position:absolute;inset:-60px -20px 0;background:radial-gradient(60% 70% at 30% 20%,hsl(var(--h) 45% 45% / .22),transparent 70%);pointer-events:none}
@media (min-width:900px){ .hero .amb{inset:-100px -20px 0} }
.hero .body{position:relative;flex:1;min-width:0;padding-bottom:4px}
.hero h1{font-size:24px;letter-spacing:-.01em}
.hero .by{font-size:15.5px;color:var(--ink-3);margin-top:4px}

.about{padding:6px 20px}

const ic = (n, cls='') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
function stars(v, size='') {
  let s = '';
  for (let i = 1; i <= 5; i++) {
    const full = v >= i, half = !full && v >= i - .5;
    s += `<svg class="i fill ${full||half?'':'off'}" viewBox="0 0 24 24" aria-hidden="true">${half ? '<defs><linearGradient id="hg'+i+'"><stop offset="50%" stop-color="currentColor"/><stop offset="50%" stop-color="rgba(0,0,0,0)"/></linearGradient></defs><path fill="url(#hg'+i+')" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/><path fill="none" stroke="currentColor" stroke-width="1.6" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/>' : I.star}</svg>`;
  }
  return `<span class="stars ${size}" aria-label="${v} of 5">${s}</span>`;
}
function cover(b, size, opts={}) {
  const a = opts.author === false ? '' : `<span class="ca">${esc(b.author.split(' ').slice(-1)[0])}</span>`;
  const act = opts.act === false ? '' : ` data-act="open-book" data-id="${b.id}" role="button" tabindex="0"`;
  return `<div class="cover cover-${size} ${b.classic?'classic':''}" style="--h:${b.hue}"${act} aria-label="${esc(b.title)}">${opts.badge||''}<span class="ct">${esc(b.title)}</span>${a}</div>`;
}

function bookHTML(id = S.book) {
  const b = byId(id) || BOOKS[0];
  const hls = HIGHLIGHTS.filter(h => h.book === b.id);
  const notes = JOURNAL.filter(j => j.book === b.id);
  const items = [];
  if (b.started) items.push({when:b.started, mk:'teal', icn:'book', html:`<b>Started</b>`});
  if (b.status==='reading') items.push({when:'2026-09-12', mk:'', icn:'pen', html:`Logged pages <b>40 to 88</b> over four evenings`});
  hls.forEach(h => items.push({when:h.date, mk:'star', icn:'star', fill:true, html:hlCard(h)}));
  notes.filter(n=>n.kind==='note').forEach(n => items.push({when:n.date, mk:'', icn:'pen', html:`<div class="hl" style="border-left-color:var(--amber)"><div style="font-size:15.5px;color:var(--ink-2)">${esc(n.text)}</div><div class="m">Your note</div></div>`}));
  if (b.status==='reading') items.push({when:'2026-09-24', mk:'', icn:'pen', html:`Logged pages <b>88 to ${b.page}</b>`});
  if (b.finished) items.push({when:b.finished, mk:'fill', icn:'check', html:`<b>Finished</b> · ${b.rating?stars(b.rating):''}`});
  if (b.review) items.push({when:b.finished, mk:'', icn:'pen', html:`<div class="hl" style="border-left-color:var(--amber)"><div style="font-size:15.5px;color:var(--ink-2)">${esc(b.review)}</div><div class="m">Your review</div></div>`});
  (S.noteDrafts[b.id]||[]).forEach(t => items.push({when:'2026-09-25', mk:'', icn:'pen', html:`<div class="hl" style="border-left-color:var(--amber)"><div style="font-size:15.5px;color:var(--ink-2)">${esc(t)}</div><div class="m">Your note · just now</div></div>`}));
  items.sort((a,b)=>a.when.localeCompare(b.when));
  const also = BOOKS.filter(x => x.id !== b.id && (x.author === b.author || x.tags.some(t => b.tags.includes(t)))).slice(0,5);
  const pct = b.status==='reading' ? Math.round(b.page/b.pages*100) : 0;
  return `<div class="hero" style="--h:${b.hue}"><div class="amb"></div>
    <button class="icon-btn" data-act="back" aria-label="Back" style="position:absolute;top:10px;left:12px;z-index:2;background:color-mix(in srgb,var(--paper) 70%,transparent)">${ic('back')}</button>
    <div style="height:34px;flex:0 0 100%"></div>
    ${cover(b,'lg',{act:false})}
    <div class="body"><h1>${esc(b.title)}</h1><div class="by">by <a href="#" data-act="toast" data-msg="Author view: ${esc(b.author)}">${esc(b.author)}</a></div>${b.pages?`<div class="meta" style="margin-top:6px">${b.pages} pages${b.finished?` · finished ${fmtMY(b.finished)}`:''}</div>`:''}</div></div>
  <div class="ctrl"><button class="pill ${b.status}" data-act="sheet" data-id="status" data-book="${b.id}"><span class="dot"></span>${STATUS[b.status].label} ${ic('down')}</button><button data-act="rate" data-id="${b.id}" aria-label="Rate">${stars(b.rating||0)}</button><button class="icon-btn more" data-act="sheet" data-id="quick" data-book="${b.id}" aria-label="More">${ic('more')}</button></div>
  ${b.status==='reading'?`<div class="pad" style="display:grid;gap:8px;padding-top:6px"><div class="pbar"><i style="width:${pct}%"></i></div><div style="display:flex;justify-content:space-between;align-items:center"><span class="meta">p. <b>${b.page}</b> of ${b.pages} · ${pct}%</span><button class="btn ghost sm" data-act="sheet" data-id="log" data-book="${b.id}">${ic('pen')} Log pages</button></div></div>`:''}
  <div class="sec" style="padding-top:18px"><div class="sec-h"><h2>Journal</h2><span class="meta">${items.length} entries</span></div></div>
  <div class="tl">${items.map(it => `<div class="it"><div class="mk ${it.mk}">${ic(it.icn, it.fill?'fill':'')}</div><div><div class="when">${fmt(it.when).toUpperCase()}</div><div class="what">${it.html}</div></div></div>`).join('')}
    <div class="it"><div class="mk">${ic('plus')}</div><div class="note-in"><input id="note-${b.id}" placeholder="Add a note…" data-book="${b.id}"><button class="btn primary sm" data-act="note" data-id="${b.id}">Add</button></div></div></div>
  ${b.desc?`<div class="about"><div class="card ${S.aboutOpen?'open':''}" data-act="about"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">About</span>${ic(S.aboutOpen?'up':'down')}</div><p>${esc(b.desc)}</p></div></div>`:''}
  <div class="links"><span class="chip">${ic('link')} Amazon</span><span class="chip">${ic('link')} Libby</span><span class="chip">${ic('link')} Wikipedia</span></div>
  ${also.length?`<div class="sec" style="padding-top:14px"><div class="sec-h"><h2>Also on your shelves</h2></div></div><div class="hscroll">${also.map(x=>`<div class="cell">${cover(x,'grid')}<div class="t">${esc(x.title)}</div></div>`).join('')}</div>`:''}
  <div style="height:20px"></div>`;
}

function storyHTML(idx = S.storyIdx) {
  const y = S.year === 'all' ? YEAR : S.year;
  const done = finishedIn(y), pages = pagesIn(y);
  const five = done.filter(b => b.rating === 5);
  const longest = [...done].sort((a,b)=>b.pages-a.pages)[0];
  const tags = {}; done.forEach(b=>b.tags.forEach(t=>tags[t]=(tags[t]||0)+1));
  const top = Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const favs = HIGHLIGHTS.filter(h=>h.fav && yr(h.date)===y).slice(0,2);
  const slides = [
    `<div class="k">Your ${y} in books</div><div class="big">${done.length}</div><h2>books finished</h2><p>${pages.toLocaleString()} pages. That is about ${Math.round(pages/365)} a day, every day, including the ones you didn't.</p>`,
    `<div class="k">What you reached for</div><h2>Mostly memoir and the classics</h2><div class="bar">${top.map(([t,n])=>`<div class="r"><span>${esc(t)}</span><i style="width:${Math.round(n/top[0][1]*100)}%"></i><span>${n}</span></div>`).join('')}</div>`,
    `<div class="k">Longest</div><div class="shelf">${cover(longest,'lg',{act:false})}</div><h2>${esc(longest.title)}</h2><p>${longest.pages} pages, finished in ${fmtMY(longest.finished)}. Shoe Dog was the fastest: four days.</p>`,
    `<div class="k">Your five-star shelf</div><div class="shelf">${five.map(b=>cover(b,'md',{act:false,author:false})).join('')}</div><h2>${five.length} books you'd hand to anyone</h2><p>${five.map(b=>esc(b.title)).join(', ')}.</p>`,
    `<div class="k">Kept</div><h2>Highlights you starred</h2>${favs.map(h=>`<p style="font-family:var(--serif);font-style:italic;font-size:19px;color:#FAF7F2">“${esc(h.text)}”</p><p style="font-size:14px">${esc(byId(h.book).title)}</p>`).join('')}`,
    `<div class="k">Share</div><h2>Your ${y}, as a card</h2><p>One image with the numbers, the five-star shelf and one highlight. Nothing else leaves the app.</p><div style="display:flex;gap:10px"><button class="btn primary" data-act="toast" data-msg="Saved to Photos">${ic('share')} Share card</button><button class="btn secondary" style="color:#FAF7F2;border-color:#57534E" data-act="story-close">Done</button></div>`,
  ];
  return `<button class="story-x" data-act="story-close" aria-label="Close">${ic('x')}</button><div class="story" id="story">${slides.map(s=>`<div class="slide">${s}</div>`).join('')}</div><div class="dots">${slides.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div>`;
}

function rankHTML() {
  const pool = finishedIn(YEAR);
  const [a, b] = S.rank.pair.map(i => pool[i % pool.length]);
  const top = [...pool].sort((x,y)=>(y.rating||0)-(x.rating||0)).slice(0,3);
  return `<div class="hdr"><div style="display:flex;align-items:center;gap:6px"><button class="icon-btn" data-act="tab" data-id="you" aria-label="Back">${ic('back')}</button><h1 style="font-size:26px">Rank</h1></div><div class="tools"><button class="btn secondary sm" data-act="tab" data-id="you">Stop</button></div></div>
  <p class="eyebrow pad" style="text-align:center;padding-bottom:10px">Which book is better?</p>
  <div class="battle">${[a,b].map((x,i)=>`<button class="b ${S.rank.win===x.id?'win':''}" data-act="pick" data-id="${x.id}">${cover(x,'lg',{act:false})}<div class="t">${esc(x.title)}</div><div class="meta" style="font-size:13px">${esc(x.author)}</div></button>`).join('')}</div>
  <div class="vs">VS</div>
  <p class="meta pad" style="text-align:center">${S.rank.count} matchups · tap a book to choose</p>
  <div class="sec" style="padding-top:22px"><div class="sec-h"><h2>Current top 3</h2></div><div class="card">${top.map((x,i)=>`<div class="row" style="padding:10px 14px"><span style="font-family:var(--serif);font-weight:700;font-size:18px;width:22px;color:${i===0?'var(--amber)':'var(--ink-4)'}">${i+1}</span>${cover(x,'sm',{act:false})}<div class="body"><div class="t" style="font-size:16px">${esc(x.title)}</div><div class="a">${esc(x.author)}</div></div><span class="meta" style="font-family:var(--mono);font-size:13px">${1500+Math.round((x.rating||3)*40)}</span></div>`).join('')}</div></div>`;
}

function circleHTML() {
  return `<div class="hdr"><div style="display:flex;align-items:center;gap:6px"><button class="icon-btn" data-act="tab" data-id="you" aria-label="Back">${ic('back')}</button><h1 style="font-size:26px">Circle</h1></div><div class="tools"><button class="btn secondary sm" data-act="toast" data-msg="Invite link copied">${ic('plus')} Invite</button></div></div>
  <div class="sec"><div class="card" style="padding:14px 16px;display:flex;gap:12px;align-items:center;border-color:var(--teal-line);background:var(--teal-wash)">${cover(byId('phm'),'sm',{act:false})}<div style="flex:1"><div style="font-weight:600">Sara passed you <em>Project Hail Mary</em></div><div class="meta">“Made me cry on a plane. You'll like the science.”</div></div><button class="btn primary sm" data-act="toast" data-msg="It's on your To read shelf">Keep</button></div></div>
  <div class="sec"><div class="sec-h"><h2>Reading now</h2></div><div class="card">${CIRCLE.map(m=>{const r=byId(m.reading);return `<div class="member"><div class="avatar" style="--h:${m.hue}">${m.name[0]}</div><div class="body"><div class="nm">${m.name}${m.me?' <span class="meta">(you)</span>':''}</div><div class="rd">Reading <b style="color:var(--ink-2);font-weight:500">${esc(r.title)}</b></div></div><div class="minis">${m.done.map(id=>cover(byId(id),'sm',{act:false})).join('')}</div></div>`;}).join('')}</div></div>
  <div class="sec"><div class="sec-h"><h2>Summer reads</h2><span class="meta">shared shelf · 4 books</span></div><div class="hscroll" style="padding-inline:0">${['phm','dune','pir','bac'].map(id=>`<div class="cell">${cover(byId(id),'grid',{act:false})}<div class="t">${esc(byId(id).title)}</div></div>`).join('')}</div></div>
  <div class="sec"><p class="meta">Members see titles, covers and dates only. Your notes, highlights and reviews stay private unless you pass one on purpose.</p></div>`;

      <div>${[['The Name of the Wind','Patrick Rothfuss',340,false],['The Name of the Rose','Umberto Eco',0,true],['In the Name of Identity','Amin Maalouf',95,false]].map(([t,a,h,c],i)=>`<div class="result">${cover({title:t,author:a,hue:h,classic:c},'sm',{act:false})}<div class="body"><div class="t">${esc(t)}</div><div class="a">${esc(a)}</div></div><button class="btn ${i===0?'primary':'secondary'} sm" data-act="add-result" data-id="${esc(t)}">${i===0?'On shelf':'Add'}</button></div>`).join('')}</div>

      <div style="display:flex;gap:12px;align-items:center">${cover(bk,'sm',{act:false})}<div><div style="font-weight:600">${esc(bk.title)}</div><div class="meta">was on p. ${bk.page} of ${bk.pages}</div></div></div>
      <div class="bignum" id="lognum">${bk.page}<small>page you're on</small></div>
      <div class="numpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="num" data-id="${n}">${n}</button>`).join('')}<button data-act="num" data-id="clear" aria-label="Clear">C</button><button data-act="num" data-id="0">0</button><button data-act="num" data-id="del" aria-label="Delete">⌫</button></div>

    case 'quick': { const bk = b || BOOKS[0]; return `<div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">${cover(bk,'sm',{act:false})}<div><div style="font-weight:600;font-family:var(--serif);font-size:17px">${esc(bk.title)}</div><div class="meta">${esc(bk.author)}</div></div></div>
      <button class="action" data-act="sheet" data-id="status" data-book="${bk.id}">${ic('bookmark')} Status: ${STATUS[bk.status].label} ${ic('chev','chev')}</button>
      <button class="action" data-act="rate-sheet" data-id="${bk.id}">${ic('star')} ${bk.rating?`Rating: ${bk.rating} / 5`:'Rate this book'}</button>
      <button class="action" data-act="open-book" data-id="${bk.id}">${ic('pen')} Add a note</button>
      <button class="action" data-act="sheet" data-id="edit" data-book="${bk.id}">${ic('sliders')} Edit details</button>
      <button class="action" data-act="sheet" data-id="pass" data-book="${bk.id}">${ic('send')} Pass to someone</button>
      <button class="action danger" data-act="toast" data-msg="Removed from your shelves">${ic('trash')} Remove</button>`; }
    case 'status': { const bk = b || BOOKS[0]; return `<h2>Status</h2>${Object.entries(STATUS).map(([k,v])=>`<button class="opt" data-act="set-status" data-id="${bk.id}" data-status="${k}"><span class="dot" style="background:var(--${k==='reading'?'teal':k==='tbr'?'amber':k==='read'?'emerald':'rose'})"></span>${v.label}${bk.status===k?ic('check','chk'):''}</button>`).join('')}`; }
    case 'edit': { const bk = b || {title:'',author:'',status:'tbr',tags:[],hue:200}; return `<h2>${bk.id?'Edit details':'Add manually'}</h2><div class="stack">
      <div class="field"><label>Title</label><input value="${esc(bk.title)}"></div>

      ${bk.status==='reading'?`<div class="field"><label>Current page</label><input inputmode="numeric" value="${bk.page||''}"></div>`:''}
      <div class="field"><label>Tags</label><div style="display:flex;flex-wrap:wrap;gap:6px">${(bk.tags||[]).map(t=>`<span class="chip on">${esc(t)} ${ic('x')}</span>`).join('')}<span class="chip">${ic('plus')} Add tag</span></div></div>

      <div style="display:flex;gap:10px;padding-top:4px"><button class="btn secondary block" data-act="close-sheet">Cancel</button><button class="btn primary block" data-act="toast" data-msg="Saved">Save</button></div></div>`; }
    case 'find': return `<h2>Find something</h2><div class="stack">

      <div id="findres"></div></div>`;

      <button class="btn ghost" data-act="sheet" data-id="find">${ic('shuffle')} Try another prompt</button></div>`;
    case 'hlact': { const h = HIGHLIGHTS.find(x=>x.id===arg) || HIGHLIGHTS[0]; return `<p class="quote" style="font-size:16px;margin-bottom:10px">“${esc(h.text)}”</p>

      <button class="action" data-act="sheet" data-id="quote" data-hl="${h.id}">${ic('share')} Quote card</button>
      <button class="action" data-act="ask-hl">${ic('sparkle')} Ask about this</button>`; }
    case 'quote': { const h = HIGHLIGHTS.find(x=>x.id===arg) || daily; const bk = byId(h.book); return `<h2>Quote card</h2><div class="stack">
      <div style="aspect-ratio:4/5;border-radius:18px;padding:26px 24px;display:grid;align-content:space-between;background:linear-gradient(160deg,hsl(${bk.hue} 40% 30%),hsl(${bk.hue} 46% 14%));color:#FAF7F2;box-shadow:var(--shadow-cover)"><div class="eyebrow" style="color:rgba(250,247,242,.6)">Kitab · ${fmt(h.date)}</div><p style="font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.4;text-wrap:balance">“${esc(h.text)}”</p><div style="display:flex;gap:12px;align-items:center">${cover(bk,'sm',{act:false})}<div><div style="font-weight:600">${esc(bk.title)}</div><div style="font-size:13.5px;opacity:.75">${esc(bk.author)}</div></div></div></div>
      <div style="display:flex;gap:10px"><button class="btn secondary block" data-act="toast" data-msg="Saved to Photos">${ic('download')} Save</button><button class="btn primary block" data-act="toast" data-msg="Share sheet opens">${ic('share')} Share</button></div></div>`; }
    case 'typehl': return `<h2>Type a highlight</h2><div class="stack"><p class="meta">For paper books. Paste from Live Text or type it in.</p><div class="field"><label>Book</label><select>${BOOKS.filter(b=>b.status!=='tbr').map(b=>`<option>${esc(b.title)}</option>`).join('')}</select></div><div class="field"><label>Highlight</label><textarea rows="4" placeholder="The passage…"></textarea></div><div class="field"><label>Page (optional)</label><input inputmode="numeric" placeholder="e.g. 142"></div><button class="btn primary block" data-act="toast" data-msg="Highlight saved">Save</button></div>`;
    case 'pass': { const bk = b || BOOKS[0]; return `<h2>Pass <em style="font-style:italic;font-weight:400">${esc(bk.title)}</em> to</h2><div class="stack">${CIRCLE.filter(m=>!m.me).map(m=>`<button class="opt" data-act="toast" data-msg="Passed to ${m.name}"><span class="avatar" style="--h:${m.hue};width:32px;height:32px;font-size:14px">${m.name[0]}</span>${m.name}<span class="meta" style="margin-left:auto">reading ${esc(byId(m.reading).title)}</span></button>`).join('')}<div class="field"><label>Note</label><input placeholder="Why they'd like it"></div></div>`; }

  }
  return '';
}

/* ───────────────────────── Rendering ───────────────────────── */
const screensEl = document.getElementById('screens');
const tabbarEl = document.getElementById('tabbar');
const sheetsEl = document.getElementById('sheets');
const toastEl = document.getElementById('toast');
const TABS = [['home','Home','home'],['shelves','Shelves','shelves'],['highlights','Highlights','quote'],['you','You','user']];
const FULL = new Set(['book','story','rank','circle']);
let logBuf = '';

function screenHTMLFor(name, o={}) {
  switch (name) {
    case 'home': return homeHTML();
    case 'shelves': return shelvesHTML(o.shelf ?? S.shelf, o.search);
    case 'highlights': return highlightsHTML(o.hseg ?? S.hseg, o.answered ?? S.askAnswer);
    case 'you': return youHTML(o.year ?? S.year);
    case 'book': return bookHTML(o.book ?? S.book);
    case 'story': return storyHTML(o.storyIdx ?? S.storyIdx);
    case 'rank': return rankHTML();
    case 'circle': return circleHTML();
  }
  return '';
}
function render() {
  const cur = S.screen;
  const tabFor = {home:'home',shelves:'shelves',highlights:'highlights',you:'you',book:S.fromTab||'shelves',story:'you',rank:'you',circle:'you'}[cur];
  screensEl.innerHTML = `<div class="screen on ${FULL.has(cur)?'full':''}" id="scr-${cur}">${screenHTMLFor(cur)}</div>`;
  tabbarEl.innerHTML = TABS.map(([id,l,i]) => `<button class="${tabFor===id?'on':''}" data-act="tab" data-id="${id}">${ic(i, i==='quote'?'fill':'')}${l}</button>`).join('');
  tabbarEl.style.display = cur === 'story' ? 'none' : '';
  if (cur === 'story') { const st = document.getElementById('story'); if (st) { st.addEventListener('scroll', () => { const i = Math.round(st.scrollLeft / st.clientWidth); if (i !== S.storyIdx) { S.storyIdx = i; document.querySelectorAll('.dots i').forEach((d,k)=>d.classList.toggle('on',k===i)); } }, {passive:true}); } }
  renderRail();
}
function showScreen(name, patch={}) { Object.assign(S, patch); if (TABS.some(t=>t[0]===name)) S.fromTab = name; S.screen = name; closeSheet(); render(); const sc = document.getElementById('scr-'+name); if (sc) sc.scrollTop = 0; }
function openSheet(id, arg) {
  S.sheet = {id, arg};
  sheetsEl.innerHTML = `<div class="backdrop" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>${sheetHTML(id, arg)}</div>`;
  requestAnimationFrame(() => sheetsEl.classList.add('on'));
  logBuf = '';
}
function closeSheet() { S.sheet = null; sheetsEl.classList.remove('on'); setTimeout(() => { if (!S.sheet) sheetsEl.innerHTML = '<div class="backdrop" data-act="close-sheet"></div>'; }, 260); }
let toastT;
function toast(msg, action) {
  toastEl.innerHTML = `<span>${esc(msg)}</span>${action?`<button data-act="${action.act}" data-id="${action.id||''}">${esc(action.label)}</button>`:''}`;
  toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2600);
}

/* ───────────────────────── Actions ───────────────────────── */
function act(el) {
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'tab': showScreen(id, id==='shelves' && el.dataset.search ? {} : {}); if (id==='shelves' && el.dataset.search) { screensEl.querySelector('#scr-shelves').innerHTML = shelvesHTML(S.shelf, true); } break;
    case 'shelf': S.shelf = id; showScreen('shelves'); break;
    case 'hseg': S.hseg = id; S.askAnswer = false; showScreen('highlights'); break;
    case 'year': S.year = id === 'all' ? 'all' : parseInt(id,10); render(); break;
    case 'open-book': S.book = id; S.aboutOpen = false; showScreen('book'); break;
    case 'back': showScreen(S.fromTab || 'shelves'); break;
    case 'sheet': openSheet(id, el.dataset.book || el.dataset.hl); break;
    case 'close-sheet': closeSheet(); break;
    case 'toast': toast(el.dataset.msg || 'Done'); break;
    case 'start': { const b = byId(id); b.status='reading'; b.page=0; b.pages=b.pages||320; b.started='2026-09-25'; toast(`Started “${b.title}”`); render(); break; }
    case 'add-sug': { const s = SUGGEST[parseInt(id,10)]; if (!s.added) { s.added = true; BOOKS.push({id:'sug'+id, title:s.title, author:s.author, status:'tbr', order:99, hue:s.hue, tags:['philosophy']}); } toast(`Added “${s.title}” to To read`, {label:'Edit', act:'sheet', id:'edit'}); if (S.screen==='shelves') render(); break; }
    case 'add-result': toast(`Added “${id}” to To read`, {label:'Edit', act:'sheet', id:'edit'}); closeSheet(); break;
    case 'num': { const n = document.getElementById('lognum'); if (!n) break; if (id==='clear') logBuf=''; else if (id==='del') logBuf=logBuf.slice(0,-1); else if (logBuf.length<4) logBuf+=id; n.firstChild.textContent = logBuf || '0'; break; }
    case 'log-save': { const b = byId(id); const v = parseInt(logBuf,10); if (v && v<=b.pages) { b.page = v; toast(`Logged to p. ${v}`); } else if (!v) { toast('Type the page you are on'); break; } closeSheet(); render(); break; }
    case 'finish': { const b = byId(id); b.status='read'; b.finished='2026-09-25'; b.rating = b.rating||0; closeSheet(); toast(`Finished “${b.title}”`, {label:'Rate', act:'rate-sheet', id:b.id}); render(); break; }
    case 'set-status': { const b = byId(id); b.status = el.dataset.status; if (b.status==='read' && !b.finished) b.finished='2026-09-25'; closeSheet(); toast(`${b.title} · ${STATUS[b.status].label}`); render(); break; }
    case 'rate': case 'rate-sheet': openSheet('rate', id); break;
    case 'set-rating': { const b = byId(id); b.rating = parseInt(el.dataset.v,10); closeSheet(); toast(`Rated ${b.rating} / 5`); render(); break; }
    case 'note': { const inp = document.getElementById('note-'+id); const t = (inp?.value||'').trim(); if (!t) { inp?.focus(); break; } (S.noteDrafts[id] = S.noteDrafts[id]||[]).push(t); render(); toast('Note added'); const sc=document.getElementById('scr-book'); if(sc) sc.scrollTop = sc.scrollHeight; break; }
    case 'about': S.aboutOpen = !S.aboutOpen; render(); break;
    case 'ask': S.hseg='ask'; S.askAnswer = true; render(); break;
    case 'ask-hl': closeSheet(); S.hseg='ask'; S.askAnswer=true; showScreen('highlights'); break;
    case 'fav': { const h = HIGHLIGHTS.find(x=>x.id===id); h.fav = !h.fav; closeSheet(); toast(h.fav?'Favourited':'Removed from favourites'); render(); break; }
    case 'find-go': openSheet('findres'); break;
    case 'story': S.storyIdx = 0; showScreen('story'); break;
    case 'story-close': showScreen('you'); break;
    case 'rank': showScreen('rank'); break;
    case 'circle': showScreen('circle'); break;
    case 'pick': { S.rank.win = id; S.rank.count++; render(); setTimeout(() => { S.rank.win = null; S.rank.pair = S.rank.pair.map(i => (i + 2) % finishedIn(YEAR).length); render(); }, 550); break; }
    case 'switch': el.classList.toggle('on'); break;
  }
}
document.getElementById('phone').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  e.stopPropagation(); act(el);
});
document.getElementById('phone').addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && e.target.matches('[data-act][role="button"]')) { e.preventDefault(); act(e.target); } });
/* long-press → quick actions */
let lpT = null, lpMoved = false;
const phoneEl = document.getElementById('phone');
phoneEl.addEventListener('pointerdown', e => { const el = e.target.closest('[data-lp]'); if (!el) return; lpMoved = false; lpT = setTimeout(() => { lpT = null; const v = el.dataset.lp; if (v.startsWith('hl:')) openSheet('hlact', v.slice(3)); else openSheet('quick', v); }, 480); });
phoneEl.addEventListener('pointermove', () => { if (lpT) { clearTimeout(lpT); lpT = null; } });
phoneEl.addEventListener('pointerup', () => { if (lpT) { clearTimeout(lpT); lpT = null; } });
phoneEl.addEventListener('pointercancel', () => { if (lpT) { clearTimeout(lpT); lpT = null; } });
phoneEl.addEventListener('contextmenu', e => { if (e.target.closest('[data-lp]')) e.preventDefault(); });

/* ───────────────────────── Studio rail + board ───────────────────────── */
const JUMPS = [
  ['Home', () => showScreen('home'), 'Now, next up, today\'s highlight, one line of numbers.'],
  ['Shelves · Reading', () => showScreen('shelves', {shelf:'reading'}), 'Library and TBR merged. One segmented control.'],
  ['Shelves · To read', () => showScreen('shelves', {shelf:'tbr'}), 'Drag order, notes and swipe gestures survive. Find something lives here.'],
  ['Shelves · Finished', () => showScreen('shelves', {shelf:'read'}), 'Grid of covers, sort chips, rating under each.'],
  ['Highlights', () => showScreen('highlights', {hseg:'highlights', askAnswer:false}), 'Today\'s pick, then every highlight by book. Long-press one.'],
  ['Highlights · Journal', () => showScreen('highlights', {hseg:'journal'}), 'Everything you did, by date, across books.'],
  ['Highlights · Ask', () => showScreen('highlights', {hseg:'ask', askAnswer:true}), 'An answer built only from your passages, with citations.'],
  ['You', () => showScreen('you', {year:YEAR}), 'Year, stats, calendar, three cards, then settings in five groups.'],
  ['Book page', () => showScreen('book', {book:'med'}), 'Cover-forward hero, one control row, the journal timeline.'],
  ['Add a book', () => { showScreen('shelves', {shelf:'tbr'}); openSheet('add'); }, 'Search, tap, added. Edit is optional.'],
  ['Log pages', () => { showScreen('home'); openSheet('log','med'); }, 'A number pad on the Home card.'],
  ['Quick actions', () => { showScreen('shelves', {shelf:'read'}); openSheet('quick','edu'); }, 'Long-press any cover.'],
  ['Edit details', () => { showScreen('book', {book:'edu'}); openSheet('edit','edu'); }, 'One scroll. Fields appear only when relevant. Cover picker.'],
  ['Find something', () => { showScreen('shelves', {shelf:'tbr'}); openSheet('findres'); }, 'Discover as a sheet: one prompt, one list.'],
  ['Quote card', () => { showScreen('highlights', {hseg:'highlights'}); openSheet('quote','h4'); }, 'The one social feature that fits a quiet app.'],
  ['Year in Books', () => showScreen('story', {storyIdx:0, year:YEAR}), 'Six slides, swipe sideways. Ends in a share card.'],
  ['Rank', () => showScreen('rank'), 'Demoted to a card under You. Same game.'],
  ['Reading circle', () => showScreen('circle'), 'Quiet sharing. Titles, covers and dates only.'],
];
function renderRail() {
  const jl = document.getElementById('jumplist'); if (!jl) return;
  jl.innerHTML = JUMPS.map(([l],i) => `<button data-jump="${i}" class="${S.jump===i?'on':''}">${l}<span class="k">${String(i+1).padStart(2,'0')}</span></button>`).join('');
  const n = document.getElementById('notes');
  const cur = JUMPS[S.jump ?? 0];
  n.innerHTML = `<div><b>${cur[0]}</b></div><div>${cur[2]}</div><ul><li>Tap covers to open a book, hold for quick actions.</li><li>Type sizes: 14 label, 16 body, 22+ Playfair.</li><li>Sample library. Titles are real; ratings, notes and dates are invented.</li></ul>`;
}
document.getElementById('rail').addEventListener('click', e => {
  const j = e.target.closest('[data-jump]'); if (j) { S.jump = parseInt(j.dataset.jump,10); if (S.board) toggleBoard(false); JUMPS[S.jump][1](); return; }
  const d = e.target.closest('[data-do]'); if (!d) return;
  if (d.dataset.do === 'board') toggleBoard();
  if (d.dataset.do === 'theme') { const order = ['system','light','dark']; S.theme = order[(order.indexOf(S.theme)+1)%3]; if (S.theme==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); d.textContent = 'Theme: ' + S.theme; }
});
function toggleBoard(force) {
  S.board = force ?? !S.board;
  document.getElementById('btn-board').classList.toggle('on', S.board);
  document.getElementById('stage').style.display = S.board ? 'none' : '';
  const bd = document.getElementById('board'); bd.classList.toggle('on', S.board);
  if (!S.board) { bd.innerHTML = ''; return; }
  const frames = [
    ['Home', 'Now · next up · today', {screen:'home'}],
    ['Shelves', 'To read shelf', {screen:'shelves', shelf:'tbr'}],
    ['Shelves', 'Finished shelf', {screen:'shelves', shelf:'read'}],
    ['Highlights', 'Today + by book', {screen:'highlights', hseg:'highlights'}],
    ['Journal', 'Everything by date', {screen:'highlights', hseg:'journal'}],
    ['Ask', 'Cited answer', {screen:'highlights', hseg:'ask', answered:true}],
    ['You', 'Year · calendar · settings', {screen:'you', year:YEAR}],
    ['Book', 'Hero + journal timeline', {screen:'book', book:'med'}],
    ['Add a book', 'One-tap add', {screen:'shelves', shelf:'tbr', sheet:['add']}],
    ['Log pages', 'Number pad', {screen:'home', sheet:['log','med']}],
    ['Quick actions', 'Long-press', {screen:'shelves', shelf:'read', sheet:['quick','edu']}],
    ['Edit details', 'Single scroll', {screen:'book', book:'edu', sheet:['edit','edu']}],
    ['Find something', 'Discover as a sheet', {screen:'shelves', shelf:'tbr', sheet:['findres']}],
    ['Quote card', 'Share a highlight', {screen:'highlights', hseg:'highlights', sheet:['quote','h4']}],
    ['Year in Books', 'Slide 1 of 6', {screen:'story', storyIdx:0}],
    ['Rank', 'Under You', {screen:'rank'}],
    ['Circle', 'Quiet sharing', {screen:'circle'}],
  ];
  bd.innerHTML = frames.map(([t, cap, o]) => {
    const cur = o.screen; const tabFor = {home:'home',shelves:'shelves',highlights:'highlights',you:'you',book:'shelves',story:'you',rank:'you',circle:'you'}[cur];
    const sheet = o.sheet ? `<div class="sheet-root on"><div class="backdrop"></div><div class="sheet"><div class="handle"></div>${sheetHTML(o.sheet[0], o.sheet[1])}</div></div>` : '';
    return `<div class="fr"><div class="frame"><div class="phone"><div class="statusbar"><span>9:41</span><span class="cell">●●● ⌒ ▮</span></div><div class="screens"><div class="screen on ${FULL.has(cur)?'full':''}">${screenHTMLFor(cur, o)}</div></div>${cur==='story'?'':`<nav class="tabbar">${TABS.map(([id,l,i]) => `<button class="${tabFor===id?'on':''}">${ic(i, i==='quote'?'fill':'')}${l}</button>`).join('')}</nav>`}${sheet}</div></div><div class="cap"><b>${t}</b>${cap}</div></div>`;
  }).join('');
}
S.jump = 0;
render();
</script>
